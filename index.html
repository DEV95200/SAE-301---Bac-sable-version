<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeonCinéma IDF - Carte Interactive des Cinémas</title>
  <meta name="description" content="Découvrez les cinémas d'Île-de-France sur une carte interactive avec un design néon futuriste">
  
  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
  
  <!-- Main Styles -->
  <link rel="stylesheet" href="assets/css/main.css">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  
  <!-- MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />
</head>

<body>
  <!-- Header -->
  <header class="header">
    <div class="header__container">
      <!-- Logo -->
      <a href="#" class="header__logo animate-neon">
        🎬 NeonCinéma
      </a>
      
      <!-- Navigation Desktop -->
      <nav class="header__nav">
        <ul class="nav__list">
          <li><a href="#" class="nav__link active">Accueil</a></li>
          <li><a href="#" class="nav__link">Cinémas</a></li>
          <li><a href="#" class="nav__link">À propos</a></li>
          <li><a href="#" class="nav__link">Contact</a></li>
        </ul>
      </nav>
      
      <!-- Menu Burger Mobile -->
      <button class="header__burger">
        <span class="burger__line"></span>
        <span class="burger__line"></span>
        <span class="burger__line"></span>
      </button>
    </div>
  </header>

  <!-- Sidebar Toggle Button -->
  <button class="sidebar-toggle" data-tooltip="Ouvrir/Fermer les contrôles">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
    </svg>
  </button>

  <!-- Sidebar Controls -->
  <aside class="sidebar">
    <div class="sidebar__header">
      <h2 class="sidebar__title animate-gradient">Contrôles</h2>
      <p class="sidebar__subtitle">Personnalisez votre exploration</p>
    </div>
    
    <div class="sidebar__content">
      <!-- Style de carte -->
      <div class="control-group animate-float">
        <h3 class="control-group__title">Style de Carte</h3>
        <div class="custom-select">
          <select id="map-style-select">
            <option value="osm">🗺️ Classique</option>
            <option value="satellite">🛰️ Satellite</option>
          </select>
        </div>
      </div>

      <!-- Filtres -->
      <div class="control-group animate-float">
        <h3 class="control-group__title">Filtres</h3>
        <div class="custom-select">
          <select id="departement-select">
            <option value="all">🌍 Tous les départements</option>
          </select>
        </div>
      </div>

      <!-- Statistiques -->
      <div class="sidebar__stats animate-scale">
        <div class="stats-grid stagger-animation">
          <div class="stat-item">
            <span class="stat-number" data-count="0">0</span>
            <span class="stat-label">Cinémas</span>
          </div>
          <div class="stat-item">
            <span class="stat-number" data-count="0">0</span>
            <span class="stat-label">Départements</span>
          </div>
          <div class="stat-item">
            <span class="stat-number" data-count="0">0</span>
            <span class="stat-label">Salles</span>
          </div>
          <div class="stat-item">
            <span class="stat-number" data-count="0">0</span>
            <span class="stat-label">Films</span>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="control-group animate-float">
        <h3 class="control-group__title">Actions</h3>
        <div class="d-flex gap-sm">
          <button class="btn btn--secondary" data-tooltip="Actualiser la carte">
            🔄 Actualiser
          </button>
          <button class="btn btn--ghost" data-tooltip="Plein écran" onclick="toggleFullscreen()">
            🔍 Zoom
          </button>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Map Container -->
  <main class="map-container">
    <!-- Loading Overlay -->
    <div class="map-loading" id="map-loading">
      <div class="loading-spinner"></div>
    </div>
    
    <!-- Map -->
    <div id="map"></div>
  </main>

  <!-- Scripts -->
  
  <!-- Leaflet JavaScript -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  
  <!-- MarkerCluster JavaScript -->
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
  
  <!-- Custom Scripts -->
  <script src="assets/js/animations.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="include/leaflet.js"></script>
  
  <!-- Application Initialization -->
  <script>
    // Initialize the application
    document.addEventListener('DOMContentLoaded', function() {
      // Initialize UI Manager
      const uiManager = new UIManager();
      
      // Initialize Animation Manager
      const animationManager = new AnimationManager();
      
      // Hide loading overlay after map is loaded
      setTimeout(() => {
        const loading = document.getElementById('map-loading');
        if (loading) {
          loading.style.opacity = '0';
          setTimeout(() => {
            loading.style.display = 'none';
          }, 300);
        }
      }, 2000);
      
      // Update statistics (example)
      setTimeout(() => {
        animationManager.animateCounter(document.querySelector('[data-count="0"]'), 0, 20, 1500);
        const statNumbers = document.querySelectorAll('.stat-number');
        if (statNumbers[1]) animationManager.animateCounter(statNumbers[1], 0, 8, 1500);
        if (statNumbers[2]) animationManager.animateCounter(statNumbers[2], 0, 156, 2000);
        if (statNumbers[3]) animationManager.animateCounter(statNumbers[3], 0, 89, 1800);
      }, 1000);
      
      // Show welcome toast
      setTimeout(() => {
        uiManager.showToast('🎬 Bienvenue sur NeonCinéma IDF !', 'success');
      }, 500);
    });
    
    // Fullscreen functionality
    function toggleFullscreen() {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        document.documentElement.requestFullscreen();
      }
    }
    
    // Keyboard shortcuts info
    document.addEventListener('keydown', function(e) {
      if (e.key === '?' || (e.key === 'h' && (e.ctrlKey || e.metaKey))) {
        e.preventDefault();
        const shortcuts = `
          <h3>Raccourcis Clavier</h3>
          <ul>
            <li><kbd>Ctrl + B</kbd> : Ouvrir/Fermer la sidebar</li>
            <li><kbd>Ctrl + K</kbd> : Focus sur la recherche</li>
            <li><kbd>Escape</kbd> : Fermer les modales/sidebar</li>
            <li><kbd>?</kbd> ou <kbd>Ctrl + H</kbd> : Cette aide</li>
          </ul>
        `;
        // Ici vous pourriez ouvrir une modale avec ces informations
        console.log('Raccourcis disponibles');
      }
    });
  </script>

  <!-- Performance monitoring (optional) -->
  <script>
    // Log page load performance
    window.addEventListener('load', function() {
      const loadTime = performance.now();
      console.log(`🚀 Page chargée en ${Math.round(loadTime)}ms`);
    });
  </script>
</body>
</html>
